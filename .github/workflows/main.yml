
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CryptoSignal15M-Android-Project.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: |
          unzip -o CryptoSignal15M-Android-Project.zip -d extracted
          find extracted -name settings.gradle.kts

      - name: Build APK
        run: |
          PROJECT_DIR="$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project files not found in ZIP"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoSignal15M-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
